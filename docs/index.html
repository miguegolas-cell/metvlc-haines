<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetVlc · Índice de Haines</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f6;
      color: #263238;
    }

    .page {
      max-width: 1200px;
      margin: 25px auto;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0,0,0,0.14);
    }

    .header {
      background: linear-gradient(135deg, #0b2f4f 0%, #0b6fa4 65%, #ff6a2a 100%);
      color: white;
      padding: 18px 24px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
      color: #e8f5ff;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 15px;
      background: #f6f9fb;
      border-bottom: 1px solid #dfe8ee;
    }

    .controls button {
      border: 0;
      padding: 10px 16px;
      border-radius: 10px;
      background: #0b2f4f;
      color: white;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
      transition: 0.2s ease;
    }

    .controls button:hover {
      background: #14527d;
    }

    .controls button.active {
      background: #ff6a2a;
    }

    #map {
      width: 100%;
      height: 720px;
      background: #dce8ee;
    }

    .legend {
      padding: 14px 18px;
      background: #ffffff;
      border-top: 1px solid #dfe8ee;
      font-size: 14px;
      line-height: 1.8;
      text-align: center;
    }

    .legend span {
      display: inline-block;
      width: 18px;
      height: 14px;
      margin-right: 6px;
      vertical-align: middle;
      border: 1px solid rgba(0,0,0,0.15);
    }

    .meta {
      font-size: 13px;
      color: #51636d;
      padding: 0 18px 18px;
      background: #ffffff;
      text-align: center;
    }

    .leaflet-popup-content {
      font-size: 13px;
      line-height: 1.45;
    }

    @media screen and (max-width: 900px) {
      .header h1 {
        font-size: 22px;
      }

      #map {
        height: 560px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="header">
      <h1>Índice de Haines</h1>
      <p>Cálculo experimental a partir de GFS 0.25º · Recortado a la Comunitat Valenciana</p>
    </div>

    <div class="controls">
      <button id="btn-bajo" onclick="setVariant('haines_bajo')">Haines bajo</button>
      <button id="btn-medio" class="active" onclick="setVariant('haines_medio')">Haines medio</button>
      <button id="btn-alto" onclick="setVariant('haines_alto')">Haines alto</button>
    </div>

    <div id="map"></div>

    <div class="legend">
      <b>Leyenda:</b>
      &nbsp;&nbsp;
      <span style="background:#2e7d32;"></span> 2-3 Muy bajo / bajo
      &nbsp;&nbsp;
      <span style="background:#fdd835;"></span> 4 Moderado
      &nbsp;&nbsp;
      <span style="background:#fb8c00;"></span> 5 Alto
      &nbsp;&nbsp;
      <span style="background:#d32f2f;"></span> 6 Muy alto
    </div>

    <div class="meta" id="metadata">
      Cargando metadatos...
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let geojsonData = null;
    let cvBoundaryData = null;
    let cvBoundaryLayer = null;
    let currentVariant = "haines_medio";
    let rasterLayer = null;

    const map = L.map("map", {
  preferCanvas: true,
  minZoom: 7,
  maxZoom: 11,
  maxBounds: [
    [37.60, -1.80],
    [40.95, 0.90]
  ],
  maxBoundsViscosity: 1.0
}).setView([39.35, -0.35], 8);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 12,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    function labelVariant(variant) {
      if (variant === "haines_bajo") return "Haines bajo";
      if (variant === "haines_medio") return "Haines medio";
      if (variant === "haines_alto") return "Haines alto";
      return "Haines";
    }

    function updateActiveButton() {
      document.querySelectorAll(".controls button").forEach(btn => {
        btn.classList.remove("active");
      });

      if (currentVariant === "haines_bajo") {
        document.getElementById("btn-bajo").classList.add("active");
      } else if (currentVariant === "haines_medio") {
        document.getElementById("btn-medio").classList.add("active");
      } else if (currentVariant === "haines_alto") {
        document.getElementById("btn-alto").classList.add("active");
      }
    }

    function hexToRgb(hex) {
      const clean = hex.replace("#", "");
      return {
        r: parseInt(clean.substring(0, 2), 16),
        g: parseInt(clean.substring(2, 4), 16),
        b: parseInt(clean.substring(4, 6), 16)
      };
    }

    function interpolateColor(c1, c2, t) {
      return {
        r: Math.round(c1.r + (c2.r - c1.r) * t),
        g: Math.round(c1.g + (c2.g - c1.g) * t),
        b: Math.round(c1.b + (c2.b - c1.b) * t)
      };
    }

    function colorContinuous(value) {
      const stops = [
        { value: 2, color: hexToRgb("#2e7d32") },
        { value: 3, color: hexToRgb("#66bb6a") },
        { value: 4, color: hexToRgb("#fdd835") },
        { value: 5, color: hexToRgb("#fb8c00") },
        { value: 6, color: hexToRgb("#d32f2f") }
      ];

      if (value <= 2) return stops[0].color;
      if (value >= 6) return stops[stops.length - 1].color;

      for (let i = 0; i < stops.length - 1; i++) {
        const a = stops[i];
        const b = stops[i + 1];

        if (value >= a.value && value <= b.value) {
          const t = (value - a.value) / (b.value - a.value);
          return interpolateColor(a.color, b.color, t);
        }
      }

      return stops[0].color;
    }

    function drawGeoJSONPath(ctx, geojson) {
      if (!geojson) return;

      const features = geojson.type === "FeatureCollection"
        ? geojson.features
        : [geojson];

      features.forEach(feature => {
        const geometry = feature.geometry;
        if (!geometry) return;

        let polygons = [];

        if (geometry.type === "Polygon") {
          polygons = [geometry.coordinates];
        }

        if (geometry.type === "MultiPolygon") {
          polygons = geometry.coordinates;
        }

        polygons.forEach(polygon => {
          polygon.forEach(ring => {
            ring.forEach((coord, index) => {
              const lon = coord[0];
              const lat = coord[1];
              const point = map.latLngToContainerPoint([lat, lon]);

              if (index === 0) {
                ctx.moveTo(point.x, point.y);
              } else {
                ctx.lineTo(point.x, point.y);
              }
            });

            ctx.closePath();
          });
        });
      });
    }
let outsideMaskLayer = null;

function createOutsideMask(geojson) {
  if (!geojson) return;

  if (outsideMaskLayer) {
    map.removeLayer(outsideMaskLayer);
  }

  const outerRing = [
    [34.0, -6.0],
    [34.0, 4.0],
    [43.5, 4.0],
    [43.5, -6.0],
    [34.0, -6.0]
  ];

  const holes = [];

  const features = geojson.type === "FeatureCollection"
    ? geojson.features
    : [geojson];

  features.forEach(feature => {
    const geometry = feature.geometry;
    if (!geometry) return;

    if (geometry.type === "Polygon") {
      const ring = geometry.coordinates[0].map(coord => [coord[1], coord[0]]);
      holes.push(ring);
    }

    if (geometry.type === "MultiPolygon") {
      geometry.coordinates.forEach(poly => {
        const ring = poly[0].map(coord => [coord[1], coord[0]]);
        holes.push(ring);
      });
    }
  });

  outsideMaskLayer = L.polygon(
    [outerRing, ...holes],
    {
      color: "#eef3f6",
      weight: 0,
      fillColor: "#eef3f6",
      fillOpacity: 0.92,
      interactive: false
    }
  ).addTo(map);

  outsideMaskLayer.bringToFront();

  if (cvBoundaryLayer) {
    cvBoundaryLayer.bringToFront();
  }
}
    function maskCanvasToGeoJSON(sourceCanvas, geojson) {
      if (!geojson) return sourceCanvas;

      const width = sourceCanvas.width;
      const height = sourceCanvas.height;

      const maskCanvas = document.createElement("canvas");
      const maskCtx = maskCanvas.getContext("2d");

      maskCanvas.width = width;
      maskCanvas.height = height;

      maskCtx.beginPath();
      drawGeoJSONPath(maskCtx, geojson);
      maskCtx.fillStyle = "white";
      maskCtx.fill("evenodd");

      const outputCanvas = document.createElement("canvas");
      const outputCtx = outputCanvas.getContext("2d");

      outputCanvas.width = width;
      outputCanvas.height = height;

      outputCtx.drawImage(sourceCanvas, 0, 0);
      outputCtx.globalCompositeOperation = "destination-in";
      outputCtx.drawImage(maskCanvas, 0, 0);

      return outputCanvas;
    }

    function drawRaster() {
      if (!geojsonData) return;

      const size = map.getSize();
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = size.x;
      canvas.height = size.y;

      const points = geojsonData.features.map(feature => {
        const coords = feature.geometry.coordinates;
        const latlng = L.latLng(coords[1], coords[0]);
        const pt = map.latLngToContainerPoint(latlng);

        return {
          x: pt.x,
          y: pt.y,
          value: Number(feature.properties[currentVariant]),
          feature: feature
        };
      });

      const step = 5;
      const power = 2.2;

      for (let y = 0; y < size.y; y += step) {
        for (let x = 0; x < size.x; x += step) {
          let numerator = 0;
          let denominator = 0;

          for (const p of points) {
            const dx = x - p.x;
            const dy = y - p.y;
            const dist2 = dx * dx + dy * dy;

            if (dist2 < 1) {
              numerator = p.value;
              denominator = 1;
              break;
            }

            const weight = 1 / Math.pow(Math.sqrt(dist2), power);
            numerator += p.value * weight;
            denominator += weight;
          }

          const interpolated = numerator / denominator;
          const c = colorContinuous(interpolated);

          ctx.fillStyle = `rgba(${c.r}, ${c.g}, ${c.b}, 0.72)`;
          ctx.fillRect(x, y, step + 1, step + 1);
        }
      }

      const smoothCanvas = document.createElement("canvas");
      const smoothCtx = smoothCanvas.getContext("2d");

      smoothCanvas.width = size.x;
      smoothCanvas.height = size.y;

      smoothCtx.filter = "blur(3px)";
      smoothCtx.drawImage(canvas, 0, 0);

      const clippedCanvas = maskCanvasToGeoJSON(smoothCanvas, cvBoundaryData);

      if (rasterLayer) {
        map.removeLayer(rasterLayer);
      }

      rasterLayer = L.imageOverlay(
        clippedCanvas.toDataURL("image/png"),
        map.getBounds(),
        {
          opacity: 0.74,
          interactive: false
        }
      ).addTo(map);

      if (cvBoundaryLayer) {
        cvBoundaryLayer.bringToFront();
      }
    }

    function setVariant(variant) {
      currentVariant = variant;
      updateActiveButton();
      drawRaster();
    }

    function findNearestFeature(latlng) {
      if (!geojsonData) return null;

      let nearest = null;
      let minDist = Infinity;

      geojsonData.features.forEach(feature => {
        const coords = feature.geometry.coordinates;
        const fLatLng = L.latLng(coords[1], coords[0]);
        const dist = latlng.distanceTo(fLatLng);

        if (dist < minDist) {
          minDist = dist;
          nearest = feature;
        }
      });

      return nearest;
    }

    map.on("click", function(e) {
      const feature = findNearestFeature(e.latlng);
      if (!feature) return;

      const p = feature.properties;
      const value = p[currentVariant];

      L.popup()
        .setLatLng(e.latlng)
        .setContent(`
          <b>${labelVariant(currentVariant)}: ${value}</b><br>
          <small>Punto GFS más próximo</small>
          <hr>
          <b>Haines bajo:</b> ${p.haines_bajo}<br>
          <b>Haines medio:</b> ${p.haines_medio}<br>
          <b>Haines alto:</b> ${p.haines_alto}<br>
          <hr>
          <b>Estabilidad baja:</b> ${p.estabilidad_baja} ºC<br>
          <b>Sequedad baja:</b> ${p.sequedad_baja} ºC<br>
          <b>Estabilidad media:</b> ${p.estabilidad_media} ºC<br>
          <b>Sequedad media:</b> ${p.sequedad_media} ºC<br>
          <b>Estabilidad alta:</b> ${p.estabilidad_alta} ºC<br>
          <b>Sequedad alta:</b> ${p.sequedad_alta} ºC<br>
          <hr>
          <b>T850:</b> ${p.t850} ºC<br>
          <b>T700:</b> ${p.t700} ºC<br>
          <b>T500:</b> ${p.t500} ºC<br>
          <b>HR850:</b> ${p.rh850} %<br>
          <b>HR700:</b> ${p.rh700} %
        `)
        .openOn(map);
    });

    map.on("moveend zoomend resize", function() {
      drawRaster();
    });

    fetch("cv.geojson")
      .then(response => {
        if (!response.ok) {
          throw new Error("No se pudo cargar cv.geojson");
        }
        return response.json();
      })
      .then(data => {
        cvBoundaryData = data;

       cvBoundaryLayer = L.geoJSON(cvBoundaryData, {
  style: {
    color: "#0b2f4f",
    weight: 2.2,
    opacity: 0.95,
    fillOpacity: 0
  }
}).addTo(map);

map.fitBounds(cvBoundaryLayer.getBounds(), {
  padding: [20, 20]
});

drawRaster();
      })
      .catch(error => {
        console.warn("No se ha podido cargar el límite autonómico. El raster se mostrará sin recorte.", error);
      });

    fetch("haines.geojson")
      .then(response => {
        if (!response.ok) {
          throw new Error("No se pudo cargar haines.geojson");
        }
        return response.json();
      })
      .then(data => {
        geojsonData = data;
        drawRaster();
      })
      .catch(error => {
        document.getElementById("metadata").innerHTML =
          "Error al cargar el GeoJSON del Índice de Haines.";
        console.error(error);
      });

    fetch("haines_metadata.json")
  .then(response => {
    if (!response.ok) {
      throw new Error("No se pudo cargar haines_metadata.json");
    }
    return response.json();
  })
  .then(meta => {
    function formatMadridTime(isoString) {
      ...
    }

    function cycleToMadridTime(metadata) {
      ...
    }

    function pintarMetadatos(metadata) {
      ...
    }
  })
  .catch(error => {
    document.getElementById("metadata").innerHTML =
      "No se han podido cargar los metadatos.";
    console.error(error);
  });
  </script>

</body>
</html>
