name: Actualizar GRIB GFS Haines

on:
  schedule:
    - cron: "40 3,9,15,21 * * *"

  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  actualizar-haines:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descargar último GRIB GFS
        run: python scripts/download_gfs_haines.py

      - name: Calcular Índice de Haines
        run: python scripts/process_haines.py

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_haines.grib2 data/metadata.json docs/haines.geojson docs/haines_metadata.json
          git commit -m "Actualiza GRIB y Haines" || echo "Sin cambios que guardar"
          git push
