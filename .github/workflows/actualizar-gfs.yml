name: Actualizar Haines GFS

on:
  schedule:
    # Una vez al día.
    # Descarga GFS 00 UTC +15 h.
    # 07:30 UTC da margen para que el ciclo 00 esté disponible.
    - cron: "30 7 * * *"

  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  actualizar-haines:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Procesar Haines GFS
        run: python scripts/process_haines.py

      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.geojson docs/*.json docs/*.png data/*
          git commit -m "Actualiza Haines GFS 00 UTC +15 h" || echo "Sin cambios que guardar"
          git push
