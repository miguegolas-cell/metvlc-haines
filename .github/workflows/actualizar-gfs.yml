name: Actualizar GRIB GFS Haines

on:
  schedule:
    # Ejecuta el proceso 4 veces al día, después de los ciclos GFS
    - cron: "40 3,9,15,21 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-grib:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar script de descarga GFS
        run: python scripts/download_gfs_haines.py

      - name: Guardar GRIB y metadata en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_haines.grib2 data/metadata.json
          git commit -m "Actualiza GRIB GFS Haines" || echo "Sin cambios que guardar"
          git push
