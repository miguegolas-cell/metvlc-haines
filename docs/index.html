<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetVlc · Índice de Haines</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f6;
      color: #263238;
    }

    .page {
      max-width: 1200px;
      margin: 25px auto;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0,0,0,0.14);
    }

    .header {
      background: linear-gradient(135deg, #0b2f4f 0%, #0b6fa4 65%, #ff6a2a 100%);
      color: white;
      padding: 18px 24px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
      color: #e8f5ff;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 15px;
      background: #f6f9fb;
      border-bottom: 1px solid #dfe8ee;
    }

    .controls button {
      border: 0;
      padding: 10px 16px;
      border-radius: 10px;
      background: #0b2f4f;
      color: white;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
      transition: 0.2s ease;
    }

    .controls button:hover {
      background: #14527d;
    }

    .controls button.active {
      background: #ff6a2a;
    }

    #map {
      width: 100%;
      height: 720px;
      background: #dce8ee;
    }

    .legend {
      padding: 14px 18px;
      background: #ffffff;
      border-top: 1px solid #dfe8ee;
      font-size: 14px;
      line-height: 1.8;
      text-align: center;
    }

    .legend span {
      display: inline-block;
      width: 18px;
      height: 14px;
      margin-right: 6px;
      vertical-align: middle;
      border: 1px solid rgba(0,0,0,0.15);
    }

    .meta {
      font-size: 13px;
      color: #51636d;
      padding: 0 18px 18px;
      background: #ffffff;
      text-align: center;
    }

    .leaflet-popup-content {
      font-size: 13px;
      line-height: 1.45;
    }

    @media screen and (max-width: 900px) {
      .header h1 {
        font-size: 22px;
      }

      #map {
        height: 560px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="header">
      <h1>Índice de Haines</h1>
      <p>Cálculo experimental a partir de GFS 0.25º · Comunitat Valenciana y entorno próximo</p>
    </div>

    <div class="controls">
      <button id="btn-bajo" onclick="setVariant('haines_bajo')">Haines bajo</button>
      <button id="btn-medio" class="active" onclick="setVariant('haines_medio')">Haines medio</button>
      <button id="btn-alto" onclick="setVariant('haines_alto')">Haines alto</button>
    </div>

    <div id="map"></div>

    <div class="legend">
      <b>Leyenda:</b>
      &nbsp;&nbsp;
      <span style="background:#2e7d32;"></span> 2-3 Muy bajo / bajo
      &nbsp;&nbsp;
      <span style="background:#fdd835;"></span> 4 Moderado
      &nbsp;&nbsp;
      <span style="background:#fb8c00;"></span> 5 Alto
      &nbsp;&nbsp;
      <span style="background:#d32f2f;"></span> 6 Muy alto
    </div>

    <div class="meta" id="metadata">
      Cargando metadatos...
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let geojsonData = null;
    let currentVariant = "haines_medio";
    let rasterCanvas = null;
    let rasterLayer = null;

    const map = L.map("map", {
      preferCanvas: true
    }).setView([39.45, -0.55], 8);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 12,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    function labelVariant(variant) {
      if (variant === "haines_bajo") return "Haines bajo";
      if (variant === "haines_medio") return "Haines medio";
      if (variant === "haines_alto") return "Haines alto";
      return "Haines";
    }

    function updateActiveButton() {
      document.querySelectorAll(".controls button").forEach(btn => {
        btn.classList.remove("active");
      });

      if (currentVariant === "haines_bajo") {
        document.getElementById("btn-bajo").classList.add("active");
      } else if (currentVariant === "haines_medio") {
        document.getElementById("btn-medio").classList.add("active");
      } else if (currentVariant === "haines_alto") {
        document.getElementById("btn-alto").classList.add("active");
      }
    }

    function hexToRgb(hex) {
      const clean = hex.replace("#", "");
      return {
        r: parseInt(clean.substring(0, 2), 16),
        g: parseInt(clean.substring(2, 4), 16),
        b: parseInt(clean.substring(4, 6), 16)
      };
    }

    function interpolateColor(c1, c2, t) {
      return {
        r: Math.round(c1.r + (c2.r - c1.r) * t),
        g: Math.round(c1.g + (c2.g - c1.g) * t),
        b: Math.round(c1.b + (c2.b - c1.b) * t)
      };
    }

    function colorContinuous(value) {
      const stops = [
        { value: 2, color: hexToRgb("#2e7d32") },
        { value: 3, color: hexToRgb("#66bb6a") },
        { value: 4, color: hexToRgb("#fdd835") },
        { value: 5, color: hexToRgb("#fb8c00") },
        { value: 6, color: hexToRgb("#d32f2f") }
      ];

      if (value <= 2) return stops[0].color;
      if (value >= 6) return stops[stops.length - 1].color;

      for (let i = 0; i < stops.length - 1; i++) {
        const a = stops[i];
        const b = stops[i + 1];

        if (value >= a.value && value <= b.value) {
          const t = (value - a.value) / (b.value - a.value);
          return interpolateColor(a.color, b.color, t);
        }
      }

      return stops[0].color;
    }

    function prepareRasterCanvas() {
      if (rasterLayer) {
        map.removeLayer(rasterLayer);
      }

      const size = map.getSize();

      rasterCanvas = document.createElement("canvas");
      rasterCanvas.width = size.x;
      rasterCanvas.height = size.y;
      rasterCanvas.style.width = size.x + "px";
      rasterCanvas.style.height = size.y + "px";
      rasterCanvas.style.opacity = "0.68";
      rasterCanvas.style.pointerEvents = "none";
      rasterCanvas.style.filter = "blur(2px)";

      rasterLayer = L.imageOverlay(
        rasterCanvas.toDataURL(),
        map.getBounds(),
        {
          opacity: 0.72,
          interactive: false
        }
      ).addTo(map);
    }

    function drawRaster() {
      if (!geojsonData) return;

      const size = map.getSize();
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = size.x;
      canvas.height = size.y;

      const points = geojsonData.features.map(feature => {
        const coords = feature.geometry.coordinates;
        const latlng = L.latLng(coords[1], coords[0]);
        const pt = map.latLngToContainerPoint(latlng);

        return {
          x: pt.x,
          y: pt.y,
          value: Number(feature.properties[currentVariant]),
          feature: feature
        };
      });

      /*
        Tamaño del píxel raster.
        Menor = más fino pero más pesado.
        4 o 5 suele quedar bien.
      */
      const step = 5;

      /*
        Potencia IDW:
        2 = transición suave.
        3 = algo más ajustado al punto.
      */
      const power = 2.2;

      for (let y = 0; y < size.y; y += step) {
        for (let x = 0; x < size.x; x += step) {
          let numerator = 0;
          let denominator = 0;

          for (const p of points) {
            const dx = x - p.x;
            const dy = y - p.y;
            const dist2 = dx * dx + dy * dy;

            if (dist2 < 1) {
              numerator = p.value;
              denominator = 1;
              break;
            }

            const weight = 1 / Math.pow(Math.sqrt(dist2), power);
            numerator += p.value * weight;
            denominator += weight;
          }

          const interpolated = numerator / denominator;
          const c = colorContinuous(interpolated);

          ctx.fillStyle = `rgba(${c.r}, ${c.g}, ${c.b}, 0.72)`;
          ctx.fillRect(x, y, step + 1, step + 1);
        }
      }

      /*
        Suavizado final: se pinta el canvas interpolado
        sobre otro canvas con un pequeño desenfoque visual.
      */
      const smoothCanvas = document.createElement("canvas");
      const smoothCtx = smoothCanvas.getContext("2d");

      smoothCanvas.width = size.x;
      smoothCanvas.height = size.y;

      smoothCtx.filter = "blur(3px)";
      smoothCtx.drawImage(canvas, 0, 0);

      if (rasterLayer) {
        map.removeLayer(rasterLayer);
      }

      rasterLayer = L.imageOverlay(
        smoothCanvas.toDataURL("image/png"),
        map.getBounds(),
        {
          opacity: 0.72,
          interactive: false
        }
      ).addTo(map);

      rasterLayer.bringToFront();
    }

    function setVariant(variant) {
      currentVariant = variant;
      updateActiveButton();
      drawRaster();
    }

    function findNearestFeature(latlng) {
      if (!geojsonData) return null;

      let nearest = null;
      let minDist = Infinity;

      geojsonData.features.forEach(feature => {
        const coords = feature.geometry.coordinates;
        const fLatLng = L.latLng(coords[1], coords[0]);
        const dist = latlng.distanceTo(fLatLng);

        if (dist < minDist) {
          minDist = dist;
          nearest = feature;
        }
      });

      return nearest;
    }

    map.on("click", function(e) {
      const feature = findNearestFeature(e.latlng);
      if (!feature) return;

      const p = feature.properties;
      const value = p[currentVariant];

      L.popup()
        .setLatLng(e.latlng)
        .setContent(`
          <b>${labelVariant(currentVariant)}: ${value}</b><br>
          <small>Punto GFS más próximo</small>
          <hr>
          <b>Haines bajo:</b> ${p.haines_bajo}<br>
          <b>Haines medio:</b> ${p.haines_medio}<br>
          <b>Haines alto:</b> ${p.haines_alto}<br>
          <hr>
          <b>Estabilidad baja:</b> ${p.estabilidad_baja} ºC<br>
          <b>Sequedad baja:</b> ${p.sequedad_baja} ºC<br>
          <b>Estabilidad media:</b> ${p.estabilidad_media} ºC<br>
          <b>Sequedad media:</b> ${p.sequedad_media} ºC<br>
          <b>Estabilidad alta:</b> ${p.estabilidad_alta} ºC<br>
          <b>Sequedad alta:</b> ${p.sequedad_alta} ºC<br>
          <hr>
          <b>T850:</b> ${p.t850} ºC<br>
          <b>T700:</b> ${p.t700} ºC<br>
          <b>T500:</b> ${p.t500} ºC<br>
          <b>HR850:</b> ${p.rh850} %<br>
          <b>HR700:</b> ${p.rh700} %
        `)
        .openOn(map);
    });

    map.on("moveend zoomend resize", function() {
      drawRaster();
    });

    fetch("haines.geojson")
      .then(response => {
        if (!response.ok) {
          throw new Error("No se pudo cargar haines.geojson");
        }
        return response.json();
      })
      .then(data => {
        geojsonData = data;
        drawRaster();
      })
      .catch(error => {
        document.getElementById("metadata").innerHTML =
          "Error al cargar el GeoJSON del Índice de Haines.";
        console.error(error);
      });

    fetch("haines_metadata.json")
      .then(response => {
        if (!response.ok) {
          throw new Error("No se pudo cargar haines_metadata.json");
        }
        return response.json();
      })
      .then(meta => {
        document.getElementById("metadata").innerHTML = `
          <b>Fuente:</b> ${meta.source || "GFS"} ·
          <b>Ciclo:</b> ${meta.date || ""} ${meta.cycle_utc || ""} UTC ·
          <b>Predicción:</b> +${meta.forecast_hour || 0} h ·
          <b>Generado:</b> ${meta.generated_utc || ""}
        `;
      })
      .catch(error => {
        document.getElementById("metadata").innerHTML =
          "No se han podido cargar los metadatos.";
        console.error(error);
      });
  </script>

</body>
</html>
